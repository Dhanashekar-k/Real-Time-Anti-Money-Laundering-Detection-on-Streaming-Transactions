# stream-aml feature specification — the single source of truth.
# Implemented by: features/reference.py (oracle; Spark calls it via applyInPandas)
#                 stream/flink-features (Java; must reproduce tests/golden/*.json)
# Any change to semantics or to the expanded feature list => bump spec_version,
# regenerate features/feature_names_v<N>.txt, retrain, and record a decision.

spec_version: 1
fx_version_required: 1

ordering:
  total_order: [event_ts_ms, tx_id]
  tx_id: "Equals seq assigned in M1 after a stable sort by (timestamp, source file row). Global per dataset."
  visibility: "A leg of transaction x sees only log entries with tx_id < x.tx_id. It never sees itself."
  self_transfer: "If sender_key == receiver_key, both legs (OUT first, then IN) are computed from the same pre-transaction state; both entries are appended only after both are computed."
  dir_order: {OUT: 0, IN: 1}

legs:
  description: "Each transaction produces two legs. Each account keeps one log containing both directions."
  OUT: {account: sender_key, counterparty: receiver_key, amount: amount_paid_usd_cents, role_prefix: s_}
  IN:  {account: receiver_key, counterparty: sender_key, amount: amount_received_usd_cents, role_prefix: r_}
  entry_fields: [tx_id, event_ts_ms, direction, counterparty_key, amount_usd_cents, payment_currency, receiving_currency, payment_format, hold_minutes]

account_key: "<bank_id>:<account_id>  # account ids are only unique within a bank"

money:
  unit: "int64 USD cents"
  minor_units: "to_minor(amount_str, ccy) = Decimal(amount_str).quantize(10^-exp, ROUND_HALF_EVEN) * 10^exp"
  usd_cents: "minor_to_usd_cents(minor, ccy) = (Decimal(minor) / 10^exp * fx_to_usd[ccy] * 100).quantize(1, ROUND_HALF_EVEN)"
  exponents: {USD: 2, EUR: 2, GBP: 2, CHF: 2, JPY: 0, CNY: 2, INR: 2, CAD: 2, AUD: 2, MXN: 2, BRL: 2, RUB: 2, SAR: 2, ILS: 2, BTC: 8}
  fx_table: features/fx_rates.yaml
  implementation: "features/money.py is the only Python implementation (used by M1 batch and by connectors). Flink never converts money; it reads usd cents from tx.canonical."

vocabularies:
  # Order defines the integer codes used by *_code features. Verify the names in M1 EDA; append-only.
  currencies: [USD, EUR, GBP, CHF, JPY, CNY, INR, CAD, AUD, MXN, BRL, RUB, SAR, ILS, BTC]
  payment_formats: [ACH, BITCOIN, CASH, CHEQUE, CREDIT_CARD, REINVESTMENT, WIRE]

windows:
  # Window W for a leg at time t over account a: entries e in a's log with
  #   e.tx_id < current.tx_id  AND  e.event_ts_ms > t - W_ms     (start exclusive, end inclusive)
  default: [1h, 24h, 72h]
  durations_ms: {1h: 3600000, 24h: 86400000, 72h: 259200000, 7d: 604800000}
  optional: [7d]            # HI-Large experiments only; requires spec_version bump if enabled
  state_retention_ms: 259200000   # entries older than the max window are evicted
  training_burn_in_ms: 86400000   # rows with event_ts < data_start + 24h are excluded from training (D04)

null_policy:
  counts_and_sums: "0 when the window is empty"
  ratios_and_averages: "null when the denominator is 0 (model sees NaN)"
  booleans: "0/1 integers, never null"

account_features:
  # Expanded for every window in windows.default unless 'windows' is given.
  # Emitted for both roles; names get the role prefix (s_ for OUT legs, r_ for IN legs).
  - name: out_count_{w}
    def: "number of OUT entries in window"
  - name: in_count_{w}
    def: "number of IN entries in window"
  - name: out_sum_usd_cents_{w}
    def: "sum of amount_usd_cents over OUT entries in window"
  - name: in_sum_usd_cents_{w}
    def: "sum of amount_usd_cents over IN entries in window"
  - name: distinct_out_cp_{w}
    def: "number of distinct counterparty_key among OUT entries in window"
  - name: distinct_in_cp_{w}
    def: "number of distinct counterparty_key among IN entries in window"
  - name: pass_through_ratio_{w}
    def: "out_sum_usd_cents / in_sum_usd_cents; null if in_sum == 0"
  - name: avg_hold_minutes_{w}
    def: "mean of hold_minutes over OUT entries in window with non-null hold_minutes; null if none"
    hold_minutes: "set when an OUT entry is appended: (entry.event_ts_ms - event_ts_ms of the most recent IN entry with smaller tx_id) / 60000 as a double; null if the account has no earlier IN entry (evicted IN entries still count: keep last_in_ts outside the window state)"
  - name: cross_currency_share_{w}
    def: "count of entries (both directions) with payment_currency != receiving_currency / count of entries in window; null if window empty"
  - name: format_share_{fmt}_72h
    windows: [72h]
    for_each: vocabularies.payment_formats
    def: "share of OUT entries in the 72h window with payment_format == fmt; null if no OUT entries"
  - name: account_age_minutes
    windows: none
    def: "(t - first_seen_ts) / 60000 where first_seen_ts is the event_ts_ms of the first entry ever appended to the account (kept forever, not evicted); null if no entries"
  - name: log_empty
    windows: none
    def: "1 if the account has no prior entries at all, else 0"

relational_features:
  # Computed by the account that owns the role, from its own state; emitted only for that role.
  - name: s_new_counterparty_72h
    role: OUT
    def: "1 if receiver_key is NOT among counterparties of OUT entries in the sender's 72h window, else 0"
  - name: r_new_counterparty_72h
    role: IN
    def: "1 if sender_key is NOT among counterparties of IN entries in the receiver's 72h window, else 0"
  - name: r_returned_funds_24h
    role: IN
    def: "1 if the receiver's 24h window contains an OUT entry whose counterparty_key == sender_key (2-hop cycle: money returns), else 0"
  - name: s_amount_vs_out_avg_72h
    role: OUT
    def: "amount_paid_usd_cents / (s_out_sum_usd_cents_72h / s_out_count_72h); null if s_out_count_72h == 0"

tx_features:
  - name: log10_amount_paid_usd
    def: "log10(1 + amount_paid_usd_cents / 100.0)"
  - name: is_cross_currency
    def: "1 if payment_currency != receiving_currency else 0"
  - name: payment_format_code
    def: "index of payment_format in vocabularies.payment_formats"
  - name: payment_currency_code
    def: "index in vocabularies.currencies"
  - name: receiving_currency_code
    def: "index in vocabularies.currencies"
  - name: hour_of_day
    def: "UTC hour of event_ts_ms (0-23)"
  - name: day_of_week
    def: "UTC weekday of event_ts_ms, Monday=0"
  - name: same_bank
    def: "1 if sender_bank == receiver_bank else 0"
  - name: self_transfer
    def: "1 if sender_key == receiver_key else 0"

vector_order:
  rule: "tx_features (listed order), then s_ account_features (listed order; windows in windows.default order; format shares in vocabulary order; then account_age_minutes, log_empty), then r_ account_features (same), then relational_features (listed order)"
  generated_file: features/feature_names_v1.txt
  generator: features/expand.py

not_in_v1:
  - "3-hop cycle flag (stretch; needs sender-side path tokens forwarded to the receiver)"
  - "GFP-style subgraph motifs (ablation only)"
  - "7d windows (HI-Large experiments only)"

forbidden_inputs: [is_laundering, pattern_type, attempt_id, split]
