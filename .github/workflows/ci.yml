name: ci

# Python quality gate. The same commands as locally: `make lint`, `make test`.
# Integration tests need the compose stack and are not run here (`pytest -m "not integration"`).
# The Java build is its own workflow (flink.yml) so it can use a native `paths:` filter.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.10.8" # the uv used to write uv.lock
          enable-cache: true
      - name: Install (lockfile must be up to date)
        run: uv sync --locked
      - name: Lint (ruff check + format check)
        run: make lint
      - name: Tests (not integration)
        run: make test

  compose-config:
    # Catches a broken compose file without starting anything.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate compose file, all profiles
        env:
          AML_ROOT: ${{ github.workspace }}
        run: >
          docker compose -f infra/compose/docker-compose.yml
          --profile core --profile stream --profile ml --profile orchestration --profile obs
          config --quiet

  # Added when they exist: `web` (npm ci && npm run build, M7) and `terraform` (fmt + validate).
